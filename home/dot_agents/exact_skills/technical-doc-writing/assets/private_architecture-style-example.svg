<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">文档上传：同步保存与异步索引</title>
  <desc id="desc">用户通过 Web 应用调用文档 API。文档 API 同步写入元数据数据库和文件存储，并发布 DocumentUploaded 消息到事件总线。索引 worker 消费消息后写入检索索引。同步调用使用实线，消息发布与消费使用虚线。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .node-title { font-size: 20px; font-weight: 650; fill: #0f172a; text-anchor: middle; }
      .node-subtitle { font-size: 14px; fill: #475569; text-anchor: middle; }
      .edge-label { font-size: 14px; font-weight: 550; fill: #334155; text-anchor: middle; }
      .edge-label-async { fill: #6d28d9; }
      .sync { fill: none; stroke: #475569; stroke-width: 2.5; }
      .async { fill: none; stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .label-bg { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <text x="56" y="62" font-size="30" font-weight="700" fill="#0f172a">文档上传：同步保存与异步索引</text>
  <text x="56" y="96" font-size="16" fill="#64748b">主链路从左到右；只有消息发布与消费使用虚线</text>

  <g aria-label="图例">
    <path d="M 1120 58 H 1180" class="sync"/>
    <text x="1196" y="64" font-size="14" fill="#334155">同步调用</text>
    <path d="M 1320 58 H 1380" class="async"/>
    <text x="1396" y="64" font-size="14" fill="#334155">消息发布 / 消费</text>
  </g>

  <rect x="250" y="146" width="1290" height="610" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="278" y="184" font-size="16" font-weight="650" fill="#475569">文档平台边界</text>

  <g id="edges" aria-label="系统关系">
    <path d="M 210 430 H 300" class="sync"/>
    <rect x="225" y="397" width="60" height="24" rx="6" class="label-bg"/>
    <text x="255" y="415" class="edge-label">使用</text>

    <path d="M 480 430 H 570" class="sync"/>
    <rect x="492" y="397" width="66" height="24" rx="6" class="label-bg"/>
    <text x="525" y="415" class="edge-label">HTTPS</text>

    <path d="M 750 430 H 840" class="sync"/>
    <rect x="750" y="397" width="90" height="24" rx="6" class="label-bg"/>
    <text x="795" y="415" class="edge-label">读写元数据</text>

    <path d="M 660 386 V 264 H 840" class="async"/>
    <rect x="676" y="239" width="150" height="26" rx="6" class="label-bg"/>
    <text x="751" y="257" class="edge-label edge-label-async">DocumentUploaded</text>

    <path d="M 1020 264 H 1090" class="async"/>
    <rect x="1025" y="231" width="60" height="24" rx="6" class="label-bg"/>
    <text x="1055" y="249" class="edge-label edge-label-async">消费</text>

    <path d="M 1270 264 H 1340" class="sync"/>
    <rect x="1275" y="231" width="60" height="24" rx="6" class="label-bg"/>
    <text x="1305" y="249" class="edge-label">写入</text>

    <path d="M 660 474 V 596 H 840" class="sync"/>
    <rect x="730" y="570" width="90" height="24" rx="6" class="label-bg"/>
    <text x="775" y="588" class="edge-label">写入原文</text>

    <g aria-label="箭头">
      <path d="M 300 430 L 288 424 L 288 436 Z" fill="#475569"/>
      <path d="M 570 430 L 558 424 L 558 436 Z" fill="#475569"/>
      <path d="M 840 430 L 828 424 L 828 436 Z" fill="#475569"/>
      <path d="M 840 264 L 828 258 L 828 270 Z" fill="#7c3aed"/>
      <path d="M 1090 264 L 1078 258 L 1078 270 Z" fill="#7c3aed"/>
      <path d="M 1340 264 L 1328 258 L 1328 270 Z" fill="#475569"/>
      <path d="M 840 596 L 828 590 L 828 602 Z" fill="#475569"/>
    </g>
  </g>

  <g id="nodes" aria-label="系统组件">
    <g aria-label="用户">
      <rect x="50" y="386" width="160" height="88" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
      <text x="130" y="424" class="node-title">用户</text>
      <text x="130" y="450" class="node-subtitle">外部角色</text>
    </g>
    <g aria-label="Web 应用">
      <rect x="300" y="386" width="180" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
      <text x="390" y="424" class="node-title">Web 应用</text>
      <text x="390" y="450" class="node-subtitle">浏览器</text>
    </g>
    <g aria-label="文档 API">
      <rect x="570" y="386" width="180" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
      <text x="660" y="424" class="node-title">文档 API</text>
      <text x="660" y="450" class="node-subtitle">应用服务</text>
    </g>
    <g aria-label="事件总线">
      <rect x="840" y="220" width="180" height="88" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.8"/>
      <text x="930" y="258" class="node-title">事件总线</text>
      <text x="930" y="284" class="node-subtitle">消息基础设施</text>
    </g>
    <g aria-label="索引 Worker">
      <rect x="1090" y="220" width="180" height="88" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
      <text x="1180" y="258" class="node-title">索引 Worker</text>
      <text x="1180" y="284" class="node-subtitle">异步消费者</text>
    </g>
    <g aria-label="检索索引">
      <rect x="1340" y="220" width="170" height="88" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
      <text x="1425" y="258" class="node-title">检索索引</text>
      <text x="1425" y="284" class="node-subtitle">独立存储</text>
    </g>
    <g aria-label="元数据数据库">
      <rect x="840" y="386" width="180" height="88" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
      <text x="930" y="424" class="node-title">元数据数据库</text>
      <text x="930" y="450" class="node-subtitle">事务写入</text>
    </g>
    <g aria-label="文件存储">
      <rect x="840" y="552" width="180" height="88" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="1.8"/>
      <text x="930" y="590" class="node-title">文件存储</text>
      <text x="930" y="616" class="node-subtitle">原文对象</text>
    </g>
  </g>

  <text x="56" y="792" font-size="14" fill="#64748b">读图结论：原文与元数据同步保存；检索索引由 DocumentUploaded 事件驱动。</text>
</svg>

