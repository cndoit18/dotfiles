- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: agent-default-model # magpie
  config:
    provider: magpie
    model: "auto/glm-5.3"
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write
- id: plugin-market
  name: "@deepseek-ai/dsh-plugin-market"
  config:
    indexes:
      - https://cdn.jsdelivr.net/npm/dsh-plugin-catalog/index.json
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    mobileNoAutoOpen: true
    agentOpenTools: false
    editorExplorer: true
    customCss: ""
    tabsEnabled:
      git: false
      dsh-ide-git:panel: true
      sidechat: false
      diff: false
      editor: true
    pluginSettings:
      editor:
        openWithPluginTargets: false
        openWith:
          sshHost: ""
          customEditors: []
          pinned: []
- id: worktree-space
  name: dsh-worktree-space
  config:
    panelEntry: hide
- id: git-panel
  name: "@xbzbing/dsh-git-panel"
  config:
    timeoutMs: 8000
    maxBytes: 4194304
    maxChanges: 1000
    refreshIntervalMs: 30000
    placement: tab
    defaultDiffView: unified
- id: web-search-deepseek # magpie
  name: "@deepseek-ai/dsh-web-search-deepseek"
  config:
    apiKeyEnv: MAGPIE_GATEWAY_KEY
    baseURL: "http://127.0.0.1:3425/v1"
    model: "auto/glm-5.3"
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: deepseek-official
    fetchProvider: http
