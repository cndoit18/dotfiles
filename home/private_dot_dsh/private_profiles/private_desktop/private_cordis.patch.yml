# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
    linkOpening: new-tab
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write
- id: plugin-market
  name: "@deepseek-ai/dsh-plugin-market"
  config:
    indexes:
      - https://cdn.jsdelivr.net/npm/dsh-plugin-catalog/index.json
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    mobileNoAutoOpen: true
    agentOpenTools: false
    editorExplorer: true
    customCss: ""
    tabsEnabled:
      git: false
      dsh-ide-git:panel: true
      sidechat: false
      diff: false
      editor: true
    pluginSettings:
      editor:
        openWithPluginTargets: false
        openWith:
          sshHost: ""
          customEditors: []
          pinned: []
- id: worktree-space
  name: dsh-worktree-space
  config:
    panelEntry: hide
- id: git-panel
  name: "@xbzbing/dsh-git-panel"
  config:
    timeoutMs: 8000
    maxBytes: 4194304
    maxChanges: 1000
    refreshIntervalMs: 30000
    placement: tab
    defaultDiffView: unified
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers: !!js |
      (() => {
        const { execFileSync } = process.getBuiltinModule('node:child_process')
        const baseURL = 'http://127.0.0.1:3425/v1'
        const output = execFileSync('curl', [
          '-fsS', '--max-time', '2', baseURL + '/models',
        ], { encoding: 'utf8' })
        const models = JSON.parse(output).data
        const toModel = (model) => ({
          id: model.id,
          name: model.magpie_label,
          ...(model.context_window ? { contextWindow: model.context_window } : {}),
          ...(model.max_output_tokens ? { maxTokens: model.max_output_tokens } : {}),
          ...(model.modalities ? {
            input: model.modalities.input.filter((input) => input === 'text' || input === 'image'),
          } : {}),
          ...(model.reasoning_levels?.length ? {
            reasoningEfforts: Object.fromEntries(
              model.reasoning_levels.map((effort) => [effort === 'none' ? 'off' : effort, effort]),
            ),
          } : {}),
        })
        const dshModels = models.map(toModel)
        const common = {
          apiKeyEnv: 'OPENAI_API_KEY',
          baseURL,
          api: 'openai-responses',
        }
        return {
          'mix-gateway': {
            ...common,
            displayName: '聚合网关',
            models: dshModels,
          },
        }
      })()
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: web-deepseek-api
  name: "@deepseek-ai/dsh-web-deepseek-api"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    count: 50
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api
