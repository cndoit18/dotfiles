# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      kimi-coding:
        apiKeyEnv: KIMI_CODING_API_KEY
        models:
          - id: k3
            name: Kimi K3
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
          - id: k3-256k
            name: Kimi K3-256K
            contextWindow: 262144
            maxTokens: 131072
            input:
              - text
              - image
          - id: kimi-for-coding
            name: kimi-for-coding
            contextWindow: 1048576
            maxTokens: 32768
            input:
              - text
              - image
          - id: kimi-for-coding-highspeed
            name: Kimi For Coding HighSpeed
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
              - image
          - id: k3.1-pro
            name: Kimi K3.1 Pro
            contextWindow: 1048576
            input:
              - text
              - image
            maxTokens: 131072
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              forceAdaptiveThinking: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: kimi-coding
    model: kimi-for-coding
    reasoningEffort: max
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: session-log-deepseek
  name: "@deepseek-ai/dsh-session-log-deepseek"
  config:
    enabled: false
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: workspace-write
- id: plugin-market
  name: "@deepseek-ai/dsh-plugin-market"
  config:
    indexes:
      - https://cdn.jsdelivr.net/npm/dsh-plugin-catalog/index.json
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    mobileNoAutoOpen: true
    agentOpenTools: false
    editorExplorer: true
    customCss: ""
    tabsEnabled:
      git: false
      dsh-ide-git:panel: true
      sidechat: false
      diff: false
      editor: true
    pluginSettings:
      editor:
        openWithPluginTargets: false
        openWith:
          sshHost: ""
          customEditors: []
          pinned: []
- id: worktree-space
  name: dsh-worktree-space
  config:
    panelEntry: hide
- id: git-panel
  name: "@xbzbing/dsh-git-panel"
  config:
    timeoutMs: 8000
    maxBytes: 4194304
    maxChanges: 1000
    refreshIntervalMs: 30000
    placement: tab
    defaultDiffView: unified
